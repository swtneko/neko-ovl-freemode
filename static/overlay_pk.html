<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PK Overlay v2</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: transparent;
  width: 100vw; height: 100vh;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  color: #fff;
  position: relative;
}

/* ─── TOP PK BAR ─── */
#pk-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 10px 10px 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0) 100%);
}

/* Row 1: 3 streamer headers */
.streamer-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 4px;
  margin-bottom: 4px;
}

.streamer-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  position: relative;
  overflow: hidden;
}
.streamer-chip.s1 { background: #E91E8C; justify-content: flex-start; }
.streamer-chip.s2 { background: #00BFFF; justify-content: center; }
.streamer-chip.s3 { background: #F59E0B; justify-content: flex-end; }

.streamer-chip .s-avatar {
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(255,255,255,0.3);
  border: 1.5px solid rgba(255,255,255,0.6);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; flex-shrink: 0;
  overflow: hidden;
}
.streamer-chip .s-name {
  font-size: 11px; font-weight: 800;
  letter-spacing: 0.3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
}

/* Row 2: 3-way progress bar */
.bar-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 4px;
  margin-bottom: 4px;
  align-items: center;
}

.bar-score-block {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 28px;
  border-radius: 4px;
  overflow: visible;
  position: relative;
}

/* Left block (pink) */
.bar-score-block.b1 { justify-content: flex-start; }
.bar-score-block.b2 { justify-content: center; }
.bar-score-block.b3 { justify-content: flex-end; }

.b-score {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px; font-weight: 900;
  letter-spacing: 0.5px;
  line-height: 1;
  padding: 3px 10px;
  border-radius: 4px;
  min-width: 48px;
  text-align: center;
  flex-shrink: 0;
}
.b1 .b-score { background: #E91E8C; }
.b2 .b-score { background: #00BFFF; font-size: 14px; padding: 4px 8px; min-width: auto; }
.b3 .b-score { background: #F59E0B; }

.b-progress {
  height: 28px;
  border-radius: 3px;
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  position: relative;
  overflow: hidden;
  flex: 1;
}
.b-progress::after {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 45%;
  background: rgba(255,255,255,0.2);
}
.b1 .b-progress { background: linear-gradient(90deg, #E91E8C, #ff6bb5); }
.b3 .b-progress { background: linear-gradient(90deg, #cc8800, #F59E0B); }

/* Row 3: contributor avatars */
.contrib-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 4px;
  margin-bottom: 4px;
}

.contrib-group {
  display: flex;
  gap: 2px;
  align-items: center;
}
.contrib-group.cg2 { justify-content: center; }
.contrib-group.cg3 { justify-content: flex-end; }

.contrib-av {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
}
.contrib-av + .contrib-av { margin-left: -8px; }
.contrib-av.team1 { border-color: #E91E8C; }
.contrib-av.team2 { border-color: #00BFFF; }
.contrib-av.team3 { border-color: #F59E0B; }

/* ─── CENTER INFO ─── */
#center-info {
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding-top: 118px;
  pointer-events: none;
  z-index: 10;
}

.round-label {
  font-size: 13px; font-weight: 600;
  color: rgba(255,255,255,0.75);
  letter-spacing: 1px;
}

.timer-box {
  background: rgba(0,0,0,0.75);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px;
  padding: 4px 18px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 36px; font-weight: 900;
  letter-spacing: 3px;
  color: #fff;
  line-height: 1;
  min-width: 120px;
  text-align: center;
  transition: color 0.3s;
}
.timer-box.warning { color: #FF3B6F; animation: twarn 0.5s ease-in-out infinite; }
.timer-box.finished { color: #FFD700; animation: none; }
@keyframes twarn { 0%,100%{opacity:1}50%{opacity:0.5} }



/* ─── RANKING WIDGET (bottom right) ─── */
#ranking {
  position: absolute;
  bottom: 16px; right: 10px;
  width: 180px;
  background: rgba(10,10,20,0.88);
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(12px);
}

.rank-title {
  font-size: 10px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
  padding: 7px 10px 5px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}

.rank-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  transition: all 0.35s ease;
  position: relative;
}
.rank-row:last-child { border-bottom: none; }

/* Highlighted row (active team leader) */
.rank-row.hl1 { background: rgba(233,30,140,0.25); }
.rank-row.hl2 { background: rgba(0,191,255,0.20); }
.rank-row.hl3 { background: rgba(245,158,11,0.25); }

.rank-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px; font-weight: 900;
  width: 18px; text-align: center; flex-shrink: 0;
  color: rgba(255,255,255,0.35);
}
.rank-row:nth-child(1) .rank-num { color: #FFD700; }
.rank-row:nth-child(2) .rank-num { color: #C0C0C0; }
.rank-row:nth-child(3) .rank-num { color: #CD7F32; }

.rank-crown {
  font-size: 12px;
  flex-shrink: 0;
  width: 14px;
  text-align: center;
}

.rank-av {
  width: 24px; height: 24px; border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: 1.5px solid rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
  flex-shrink: 0;
}
.rank-av.team1 { border-color: #E91E8C; background: rgba(233,30,140,0.2); }
.rank-av.team2 { border-color: #00BFFF; background: rgba(0,191,255,0.2); }
.rank-av.team3 { border-color: #F59E0B; background: rgba(245,158,11,0.2); }

.rank-name {
  flex: 1; font-size: 11px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rank-pts {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; font-weight: 700;
  flex-shrink: 0;
  color: rgba(255,255,255,0.7);
}

/* ─── TOAST ─── */
#toast {
  position: fixed;
  top: 160px; left: 50%; transform: translateX(-50%) scale(0.8);
  background: rgba(10,10,20,0.95);
  border: 1.5px solid rgba(255,255,255,0.2);
  border-radius: 24px;
  padding: 8px 20px;
  font-size: 13px; font-weight: 700;
  white-space: nowrap;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 999;
  backdrop-filter: blur(10px);
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

/* ─── TEST PANEL ─── */
#test-panel {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(5,5,15,0.97);
  border-top: 1px solid rgba(255,255,255,0.1);
  padding: 10px 12px;
  z-index: 500;
  backdrop-filter: blur(16px);
}
.test-hdr {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.test-hdr-title { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.35); text-transform: uppercase; }
.toggle-btn {
  font-size: 10px; background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.6);
  border-radius: 6px; padding: 2px 8px; cursor: pointer;
}
.toggle-btn:hover { background: rgba(255,255,255,0.14); }

#test-body { display: block; }

.test-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 6px; }

.tbtn {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: #fff; border-radius: 8px;
  padding: 7px 10px; font-size: 10px; font-weight: 600;
  cursor: pointer; text-align: left; line-height: 1.5;
  transition: background 0.15s;
}
.tbtn:hover { background: rgba(255,255,255,0.12); }
.tbtn:active { transform: scale(0.97); }
.tbtn .tag { display: block; font-size: 9px; opacity: 0.4; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 1px; }
.tbtn.pink { border-color: rgba(233,30,140,0.5); }
.tbtn.blue { border-color: rgba(0,191,255,0.5); }
.tbtn.gold { border-color: rgba(245,158,11,0.5); }

.log-box {
  background: rgba(0,0,0,0.4); border-radius: 6px;
  padding: 5px 8px; height: 44px; overflow-y: auto;
  font-size: 9.5px; font-family: monospace; color: rgba(255,255,255,0.45);
}
.log-box p { margin: 0; line-height: 1.7; }
.log-box p.ok   { color: #6ddb6d; }
.log-box p.err  { color: #FF6B6B; }
.log-box p.info { color: #66DFFF; }
.log-box p.warn { color: #FFD700; }
</style>
</head>
<body>

<!-- TOAST -->
<div id="toast"></div>

<!-- ══════════════════════════════════════
     TOP PK BAR
══════════════════════════════════════ -->
<div id="pk-bar">

  <!-- Streamer name chips -->
  <div class="streamer-row">
    <div class="streamer-chip s1">
      <div class="s-avatar" id="av-s1">🌸</div>
      <div class="s-name" id="name-s1">T015-RIN</div>
    </div>
    <div class="streamer-chip s2">
      <div class="s-avatar" id="av-s2">💙</div>
      <div class="s-name" id="name-s2">AHRI</div>
    </div>
    <div class="streamer-chip s3">
      <div class="s-avatar" id="av-s3">⭐</div>
      <div class="s-name" id="name-s3">LEA</div>
    </div>
  </div>

  <!-- Score + progress bars -->
  <div class="bar-row">
    <!-- Team 1: score left, bar extends right -->
    <div class="bar-score-block b1">
      <div class="b-score" id="pts1">0</div>
      <div class="b-progress" id="prog1" style="width:33%"></div>
    </div>

    <!-- Team 2: center label with rank info -->
    <div class="bar-score-block b2">
      <div class="b-score" id="pts2-lbl">Hạng 1(0)</div>
    </div>

    <!-- Team 3: bar extends left, score right -->
    <div class="bar-score-block b3">
      <div class="b-progress" id="prog3" style="width:33%"></div>
      <div class="b-score" id="pts3">0</div>
    </div>
  </div>

  <!-- Top contributor avatars -->
  <div class="contrib-row">
    <div class="contrib-group cg1" id="contribs-1"></div>
    <div class="contrib-group cg2" id="contribs-2"></div>
    <div class="contrib-group cg3" id="contribs-3"></div>
  </div>
</div>

<!-- ══════════════════════════════════════
     CENTER: Round + Timer + Win banner
══════════════════════════════════════ -->
<div id="center-info">
  <div class="round-label" id="round-label">Round 1</div>
  <div class="timer-box" id="timer-box">03:00</div>

</div>

<!-- ══════════════════════════════════════
     RANKING (bottom right)
══════════════════════════════════════ -->
<div id="ranking">
  <div class="rank-title">RANKING</div>
  <div id="rank-list"></div>
</div>

<!-- ══════════════════════════════════════
     TEST PANEL
══════════════════════════════════════ -->
<div id="test-panel">
  <div class="test-hdr">
    <span class="test-hdr-title">🧪 Mock Test</span>
    <button class="toggle-btn" onclick="toggleTest()">Thu gọn</button>
  </div>
  <div id="test-body">
    <div class="test-grid">
      <button class="tbtn" onclick="runTest(1)">
        <span class="tag">Test 1 — Chưa pick</span>
        🚫 user_A gửi 5000💎 → +0 (chưa pick)
      </button>
      <button class="tbtn blue" onclick="runTest(2)">
        <span class="tag">Test 2 — Pick Xanh (AHRI)</span>
        💙 user_A thả icon Xanh → Pick + +50💎
      </button>
      <button class="tbtn blue" onclick="runTest(3)">
        <span class="tag">Test 3 — Gửi thêm cho Xanh</span>
        💎 user_A gửi 3000💎 → cộng cho AHRI
      </button>
      <button class="tbtn pink" onclick="runTest(4)">
        <span class="tag">Test 4 — Chuyển sang Hồng</span>
        🌸 user_A đổi sang RIN + gửi 2000💎
      </button>
      <button class="tbtn gold" onclick="runTest(5)">
        <span class="tag">Test 5 — user_B pick Vàng</span>
        ⭐ user_B → LEA rồi gửi 8000💎
      </button>
      <button class="tbtn" onclick="resetAll()" style="border-color:rgba(255,255,255,0.25);">
        <span class="tag">Reset</span>
        🔄 Reset tất cả về 0
      </button>
    </div>
    <div class="log-box" id="log"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// STATE — driven by server WebSocket
// ═══════════════════════════════════════════
let state = null;

// ─── RENDER ─────────────────────────────────
function render() {
  if (!state) return;
  const pk = state.pk;
  if (!pk || !pk.active || !pk.lanes || pk.lanes.length === 0) return;

  const lanes = pk.lanes; // [{id, name, score, color, trigger_gift_name}]
  const total = lanes.reduce((s, l) => s + (l.score || 0), 0) || 1;

  // Sort by score để xác định leader
  const sorted = [...lanes].sort((a, b) => b.score - a.score);

  // Map lane id → rank
  const rankMap = {};
  sorted.forEach((l, i) => rankMap[l.id] = i + 1);

  // ── Update streamer chips (top 3 slots) ──
  lanes.slice(0, 3).forEach((lane, i) => {
    const n = i + 1;
    const nameEl = document.getElementById("name-s" + n);
    if (nameEl) nameEl.textContent = lane.name;
  });

  // ── Scores + bars ──
  const s = lanes.map(l => l.score || 0);
  const s0 = s[0] || 0, s1 = s[1] || 0, s2 = s[2] || 0;
  const maxS = Math.max(s0, s1, s2, 1);

  fmtEl("pts1", s0);
  fmtEl("pts3", s2);

  // Center label: leader name + score
  const leadIdx = s0 >= s1 && s0 >= s2 ? 0 : s1 >= s2 ? 1 : 2;
  const lbl = document.getElementById("pts2-lbl");
  if (lbl) lbl.textContent = `Hạng 1(${fmt(lanes[leadIdx]?.score || 0)})`;

  // Bar widths
  setW("prog1", (s0 / maxS) * 100);
  setW("prog3", (s2 / maxS) * 100);

  // ── Contributor avatars per team ──
  const viewerLane = pk.viewer_lane || {};
  // Group viewers by lane_id
  const byLane = {};
  lanes.forEach(l => byLane[l.id] = []);
  Object.entries(viewerLane).forEach(([uid, lid]) => {
    if (byLane[lid]) byLane[lid].push(uid);
  });
  lanes.slice(0, 3).forEach((lane, i) => {
    const box = document.getElementById("contribs-" + (i + 1));
    if (!box) return;
    box.innerHTML = "";
    (byLane[lane.id] || []).slice(0, 3).forEach(uid => {
      const av = document.createElement("div");
      av.className = `contrib-av team${i + 1}`;
      av.textContent = uid.slice(0, 2).toUpperCase();
      av.title = uid;
      box.appendChild(av);
    });
  });

  // ── Timer ──
  const t = state.timer || {};
  const timerEl = document.getElementById("timer-box");
  if (timerEl) {
    timerEl.textContent = fmtTime(t.remaining || 0);
    timerEl.className = "timer-box" +
      (t.finished ? " finished" : t.remaining <= 10 && t.running ? " warning" : "");
  }

  // ── Ranking (top contributors from viewer_lane × lane scores) ──
  // Build per-viewer contributions from server data (pk.viewer_lane only tells who → which lane)
  // For the leaderboard we use per-lane top 3 from state if available, else show lane totals
  renderRanking(lanes, sorted);
}

function renderRanking(lanes, sorted) {
  // Show lanes sorted by score as the leaderboard rows
  const list = document.getElementById("rank-list");
  if (!list) return;
  list.innerHTML = "";
  const crowns = ["👑", "🥈", "🥉"];
  const teamColors = ["team1", "team2", "team3"];

  sorted.forEach((lane, i) => {
    const origIdx = lanes.findIndex(l => l.id === lane.id);
    const tc = teamColors[origIdx] || "team1";
    const row = document.createElement("div");
    row.className = `rank-row hl${origIdx + 1}`;
    row.innerHTML = `
      <div class="rank-num">${i < 3 ? "" : i + 1}</div>
      <div class="rank-crown">${crowns[i] || ""}</div>
      <div class="rank-av ${tc}">${lane.name.slice(0, 2).toUpperCase()}</div>
      <div class="rank-name">${lane.name}</div>
      <div class="rank-pts">${fmt(lane.score || 0)}</div>
    `;
    list.appendChild(row);
  });

  if (!sorted.length) {
    list.innerHTML = "<div style=\"font-size:11px;color:rgba(255,255,255,0.3);text-align:center;padding:10px;\">Chưa có dữ liệu</div>";
  }
}

// ─── HELPERS ────────────────────────────────
function fmt(v) {
  if (v >= 1_000_000) return (v / 1_000_000).toFixed(1) + "M";
  if (v >= 1_000)     return (v / 1_000).toFixed(1) + "K";
  return v.toString();
}
function fmtEl(id, v) {
  const el = document.getElementById(id);
  if (el) el.textContent = fmt(v);
}
function setW(id, pct) {
  const el = document.getElementById(id);
  if (el) el.style.width = Math.max(4, pct) + "%";
}
function fmtTime(s) {
  s = Math.max(0, s | 0);
  return String(Math.floor(s / 60)).padStart(2, "0") + " : " + String(s % 60).padStart(2, "0");
}

// ─── WEBSOCKET ──────────────────────────────
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = ev => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === "state") { state = msg.data; render(); }
    } catch (e) {}
  };
  ws.onclose = () => setTimeout(connect, 1500);
}

// ─── TEST PANEL (mock — chỉ dùng khi không có server) ──
async function runTest(n) {
  const d = ms => new Promise(r => setTimeout(r, ms));
  // Inject mock state nếu server chưa setup PK
  if (!state || !state.pk || !state.pk.active) {
    alert("Cần setup PK trên Control Panel truoc! Vao /control > section PK > Bat dau PK");
    return;
  }
  alert("PK đang chạy từ server. Dùng Control Panel hoặc gửi quà TikTok để test.");
}
function resetAll() { window.location.reload(); }

let _testOpen = true;
function toggleTest() {
  _testOpen = !_testOpen;
  document.getElementById("test-body").style.display = _testOpen ? "block" : "none";
  document.querySelector(".toggle-btn").textContent = _testOpen ? "Thu gọn" : "Mở rộng";
}

connect();
</script>
</body>
</html>
