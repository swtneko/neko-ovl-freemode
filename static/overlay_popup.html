    /* Ép body và html trong suốt tuyệt đối cho OBS/vMix */
    html, body {
      background: transparent !important;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Đảm bảo khung hiển thị đúng chuẩn tỉ lệ */
    #app {
      background: transparent !important;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ===== Marquee cuộn tên dài (phải sang trái) ===== */
    .mca-marquee-track { display: inline-flex; align-items: center; white-space: nowrap; animation: mcaMarqueeScroll linear infinite; will-change: transform; }
    .mca-marquee-track .mca-gap { display: inline-block; width: 32px; flex-shrink: 0; }
    @keyframes mcaMarqueeScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* Khung marquee trong popup căn giữa theo chiều dọc, không bị đẩy lên trên */
    #w-name-marquee { display: flex; align-items: center; width: 100%; height: 100%; overflow: hidden; }
  </style>

  <!-- ============================================================ -->
  <!-- 👇 DÁN CSS TÙY CHỈNH CỦA BẠN VÀO ĐÂY (sẽ đè lên CSS ở trên) 👇 -->
  <!-- ============================================================ -->
  <style id="custom-css">
    /* Fix căn giữa tên idol */
    .widget-freemode-nick {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .widget-freemode-nick .marquee {
      position: static !important;
      top: unset !important;
      left: unset !important;
      transform: none !important;
      transform-origin: unset !important;
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-size: 7px;
      font-weight: bold;
      color: #fff;
      text-align: center;
    }
    .widget-freemode-nick .marquee .mca-marquee-track {
      justify-content: center;
    }
  </style>

</head>
<body>

<div id="app">
  <!-- Dùng transform: scale(2) hoặc scale(3) tùy kích thước livestream của bạn -->
  <div class="widget" style="transform: scale(2.5);">
    <div class="widget-freemode">
      
      <!-- Thẻ tên Idol -->
      <div class="widget-freemode-nick">
        <div class="marquee" id="w-name-marquee"></div>
      </div>

      <!-- Thời gian đếm ngược hoặc chữ Thành công -->
      <div class="widget-freemode-time" id="w-time-box">
        <span id="w-timer">00:00</span>
      </div>

      <!-- Thanh tiến trình & Điểm số -->
      <div class="widget-freemode-bar unlimit" id="w-bar-wrap" data-left="0" data-right="OVER+1">
        <p class="nocorner" id="w-bar" style="width: 0%;"></p>
      </div>

    </div>
  </div>
</div>

<script>
let state = null;

function fmtTime(sec) {
  sec = Math.max(0, sec | 0);
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return `${m}:${s}`;
}

// Cuộn tên dài từ phải sang trái nếu tên bị tràn khỏi khung hiển thị
function mcaInitMarquee(marqueeEl, text) {
  if (!marqueeEl) return;
  marqueeEl.innerHTML = "";
  const probe = document.createElement("span");
  probe.textContent = text;
  probe.style.whiteSpace = "nowrap";
  probe.style.display = "inline-block";
  marqueeEl.appendChild(probe);
  const boxWidth = marqueeEl.clientWidth;
  const textWidth = probe.scrollWidth;
  if (boxWidth > 0 && textWidth > boxWidth) {
    marqueeEl.innerHTML = "";
    const track = document.createElement("div");
    track.className = "mca-marquee-track";
    [1, 2].forEach(() => {
      const span = document.createElement("span");
      span.textContent = text;
      const gap = document.createElement("span");
      gap.className = "mca-gap";
      track.appendChild(span);
      track.appendChild(gap);
    });
    const speed = 28; // px/giây (chạy chậm & êm hơn)
    const duration = Math.max(5, (textWidth + 32) / speed);
    track.style.animationDuration = duration + "s";
    marqueeEl.appendChild(track);
  } else {
    // Tên ngắn: giữ inline, căn giữa dọc qua flexbox của cha
    probe.style.position = "static";
    probe.style.top = "";
    probe.style.left = "";
    probe.style.transform = "";
  }
}

function render() {
  if (!state) return;

  const idol = state.idols ? state.idols.find(i => i.active) : null;
  const t = state.timer || { finished: false, remaining: 0, duration: 0 };

  // 1. Cập nhật tên Idol
  const nameMarqueeEl = document.getElementById("w-name-marquee");
  const currentName = idol ? idol.name.toUpperCase() : "---";
  if (nameMarqueeEl && nameMarqueeEl.dataset.mcaName !== currentName) {
    nameMarqueeEl.dataset.mcaName = currentName;
    mcaInitMarquee(nameMarqueeEl, currentName);
  }

  // 2. Điểm phiên = score - session_base (server tự reset session_base khi bấm Start/Đặt giờ)
  const totalScore = idol ? (idol.score || 0) : 0;
  const sessionBase = idol ? (idol.session_base || 0) : 0;
  const sessionScore = Math.max(0, totalScore - sessionBase);

  // 3. Đồng hồ / trạng thái
  const timeBoxEl = document.getElementById("w-time-box");
  const barEl = document.getElementById("w-bar");
  const barWrap = document.getElementById("w-bar-wrap");

  const tgt = state.target || { enabled: false };

  if (tgt.enabled) {
    // ==== CHẾ ĐỘ MỤC TIÊU ĐIỂM ====
    const over = Math.max(0, sessionScore - tgt.score);
    const pct = tgt.score > 0 ? Math.min(100, (sessionScore / tgt.score) * 100) : 0;

    if (tgt.reached) {
      // Đã đạt — bar hồng over, OVER+X
      if (barWrap) {
        barWrap.classList.remove("unlimit");
        barWrap.classList.add("over");
        barWrap.setAttribute("data-left", sessionScore.toLocaleString());
        barWrap.setAttribute("data-right", "OVER+" + over.toLocaleString());
      }
      if (barEl) barEl.style.width = "100%";
      // Timer trắng bình thường, chỉ hiện "Thanh cong" khi het gio
      if (t.finished) {
        timeBoxEl.className = "widget-freemode-time success";
        timeBoxEl.textContent = "Thành công";
      } else {
        timeBoxEl.className = "widget-freemode-time";
        timeBoxEl.innerHTML = `<span id="w-timer">${fmtTime(t.remaining)}</span>`;
      }
    } else {
      // Chưa đạt — bar xanh tiến dần
      if (barWrap) {
        barWrap.classList.remove("unlimit");
        barWrap.classList.remove("over");
        barWrap.setAttribute("data-left", sessionScore.toLocaleString());
        barWrap.setAttribute("data-right", tgt.score.toLocaleString());
      }
      if (barEl) barEl.style.width = pct + "%";
      if (t.finished) {
        // Het gio chua dat → That bai do
        timeBoxEl.className = "widget-freemode-time fail";
        timeBoxEl.textContent = "Thất bại";
      } else {
        timeBoxEl.className = "widget-freemode-time";
        timeBoxEl.innerHTML = `<span id="w-timer">${fmtTime(t.remaining)}</span>`;
      }
    }
  } else {
    // ==== CHẾ ĐỘ THƯỜNG (timer) ====
    if (barWrap) {
      barWrap.classList.add("unlimit");
      barWrap.classList.remove("over");
      barWrap.setAttribute("data-left", sessionScore.toLocaleString());
      barWrap.setAttribute("data-right", "OVER+1");
    }

    if (t.finished) {
      timeBoxEl.className = "widget-freemode-time success";
      timeBoxEl.textContent = "Thành công";
      if (barEl) barEl.style.width = "100%";
    } else {
      timeBoxEl.className = "widget-freemode-time";
      timeBoxEl.innerHTML = `<span id="w-timer">${fmtTime(t.remaining)}</span>`;

      const elapsed = t.duration - t.remaining;
      const pct = t.duration > 0 ? Math.min(100, (elapsed / t.duration) * 100) : 0;
      if (barEl) barEl.style.width = pct + "%";
    }
  }
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  
  ws.onmessage = ev => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === "state") {
        state = msg.data;
        render();
      } else if (msg.type === "target_reached") {
        // Flash hiệu ứng khi đạt mục tiêu (state sẽ được update ngay sau đó)
        const timeBoxEl = document.getElementById("w-time-box");
        if (timeBoxEl) {
          timeBoxEl.className = "widget-freemode-time success";
          timeBoxEl.textContent = "Thành công 🎉";
        }
        const barWrap = document.getElementById("w-bar-wrap");
        if (barWrap) barWrap.classList.add("over");
        const barEl = document.getElementById("w-bar");
        if (barEl) barEl.style.width = "100%";
      }
    } catch (e) {
      console.error("Lỗi parse WebSocket data:", e);
    }
  };
  
  ws.onclose = () => setTimeout(connect, 1500);
}

mcaInitMarquee(document.getElementById("w-name-marquee"), "---");
connect();
</script>
</body>
</html>
