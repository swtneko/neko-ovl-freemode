<style>
  * { box-sizing: border-box; }
  html, body {
    background: transparent !important;
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    overflow: hidden;
  }
  #app {
    background: transparent !important;
    width: 100%; height: 100%;
    display: flex; justify-content: center; align-items: center;
  }

  /* ===== Marquee cuộn tên dài (phải sang trái) ===== */
  .mca-marquee-track { display: inline-flex; align-items: center; white-space: nowrap; animation: mcaMarqueeScroll linear infinite; will-change: transform; }
  .mca-marquee-track .mca-gap { display: inline-block; width: 32px; flex-shrink: 0; }
  @keyframes mcaMarqueeScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* ===== FIX 1: Tên ngắn (không cuộn) → lề trái thay vì căn giữa ===== */
  /* Khung .marquee chứa probe span khi không cuộn */
  .widget-mix-rank__name .marquee { display: flex; align-items: center; overflow: hidden; }
  /* span tĩnh (khi tên ngắn) → về trái, không dùng absolute center */
  .widget-mix-rank__name .marquee > span[style*="position: absolute"] {
    position: static !important;
    transform: none !important;
    top: auto !important; left: auto !important;
  }

  /* ===== FIX 2: Popup - tên dài (marquee cuộn) vẫn căn giữa dọc ===== */
  .widget-freemode-nick .marquee { display: flex; align-items: center; height: 100%; overflow: hidden; }
  .widget-freemode-nick .mca-marquee-track { align-items: center; }

  /* ===== FIX 3: Cột đơn (grid-cols-1) bị trong suốt khi có đúng N dòng ===== */
  /* grid-multi xóa background của grid nhưng các li cần giữ background riêng */
  .widget-mix-rank.grid-multi.grid-cols-1 .widget-mix-rank__grid > li {
    background: linear-gradient(90deg, rgba(0,0,0,0.95) 0%, rgba(30,30,35,0.85) 100%);
    border-radius: 6px;
    border-right: none;
  }
  /* Đảm bảo container cột đơn multi-grid không bị trong suốt hoàn toàn */
  .widget-mix-rank.grid-multi .widget-mix-rank__grid {
    background: none;
    box-shadow: none;
  }

  /* ===== Settings Panel ===== */
  #settings-panel {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.85); z-index: 999999;
    overflow-y: auto; padding: 20px; color: #fff; font-family: sans-serif;
  }
  #settings-panel.open { display: block; }
  .sp-box { background: #7c5cbf; border-radius: 12px; max-width: 680px; margin: 0 auto; font-size: 14px; overflow: hidden; }
  .sp-title { background: #6a4bb0; padding: 12px 18px; font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
  .sp-body { padding: 14px 18px; }
  .sp-section { margin-bottom: 18px; }
  .sp-section h3 { font-size: 13px; font-weight: bold; margin-bottom: 10px; color: #e0d0ff; border-bottom: 1px solid rgba(255,255,255,.2); padding-bottom: 4px; }
  .sp-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .sp-row label { min-width: 140px; color: #ddd; font-size: 13px; }
  .sp-row input[type=number] { width: 60px; padding: 4px 6px; border-radius: 5px; border: 1px solid #aaa; background: #2a2a38; color: #fff; }
  .radio-group { display: flex; gap: 14px; }
  .radio-group label { display: flex; align-items: center; gap: 5px; cursor: pointer; min-width: auto; }
  .sp-btn { display: block; width: calc(100% - 36px); margin: 8px 18px 16px; padding: 9px; background: #5a3fa0; color: #fff; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
  .toggle { position: relative; width: 44px; height: 24px; cursor: pointer; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #555; border-radius: 24px; transition: .3s; }
  .slider:before { content:""; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .3s; }
  input:checked + .slider { background: #a07fff; }
  input:checked + .slider:before { transform: translateX(20px); }
  .sp-hint { font-size: 11px; color: #ccc; margin-top: 2px; }

<!-- Khung Bảng xếp hạng giao diện Gốc mcastar -->
<div id="app">
  <div class="widget-rank" style="transform: scale(1.3);">
    <div class="widget-mix-rank w111 grid-multi grid-horizontal" id="rank-container">
      <ul class="widget-mix-rank__grid" id="rank-list">
        <!-- Render danh sách Idol vào đây -->
      </ul>
    </div>
  </div>
</div>

<script>
let state = null;
let rankElMap = new Map(); // idol.id -> { li, avEl, marqueeEl, scoreEl, nameBgEl, lastName, lastAvatar }

// 1. Đọc tham số từ URL
const urlParams = new URLSearchParams(window.location.search);

const cfg = {
  enabled:   urlParams.has("enabled") ? urlParams.get("enabled") === "1" : true,
  title:     urlParams.get("title") || "Danh sách thải",
  order:     urlParams.get("order") || "col",   // 'col' (Dọc) hoặc 'row' (Ngang)
  perCol:    Math.max(1, parseInt(urlParams.get("perCol") || "10", 10)),
  showName:  urlParams.get("name") !== "0",
  showScore: urlParams.get("score") !== "0",
  showRound: urlParams.get("round") !== "0",
  avSize:    urlParams.get("av") || "large",    // 'small', 'large', 'none'
  from:      Math.max(1, parseInt(urlParams.get("from") || "1", 10)),
  to:        Math.max(1, parseInt(urlParams.get("to") || "96", 10))
};

function initials(name) {
  return name ? name.trim().slice(0, 2).toUpperCase() : "??";
}

function render() {
  const app = document.getElementById("app");
  const rankList = document.getElementById("rank-list");
  const rankBox = document.getElementById("rank-container");

  if (!app || !rankList || !rankBox) return;

  if (!cfg.enabled || !state || !state.idols || state.idols.length === 0) {
    app.style.display = "none";
    return;
  }
  app.style.display = "flex";

  // ---------------------------------------------------------------
  // BƯỚC 1: SẮP XẾP — Không OUT: điểm cao → thấp | OUT: bị out trước xếp cao hơn
  // ---------------------------------------------------------------
  const active   = state.idols.filter(i => !i.eliminated).sort((a, b) => (Number(b.score) || 0) - (Number(a.score) || 0));
  const ousted   = state.idols.filter(i =>  i.eliminated).sort((a, b) => (b.eliminated_at || 0) - (a.eliminated_at || 0));
  let sortedAll  = [...active, ...ousted];

  let sliced = sortedAll
    .map((idol, index) => ({ idol, globalRank: index + 1 }))
    .slice(cfg.from - 1, cfg.to);

  if (sliced.length === 0) {
    rankList.innerHTML = "";
    rankElMap.clear();
    return;
  }

  // ---------------------------------------------------------------
  // BƯỚC 2: TÍNH SỐ CỘT & SỐ HÀNG
  // ---------------------------------------------------------------
  const totalItems = sliced.length;
  const numCols = Math.min(4, Math.ceil(totalItems / cfg.perCol)) || 1;
  const numRows = cfg.perCol;

  // ---------------------------------------------------------------
  // BƯỚC 3: CẬP NHẬT CLASS CONTAINER
  // ---------------------------------------------------------------
  const isHorizontal = cfg.order === "row";
  rankBox.className = `widget-mix-rank w111 grid-multi ${isHorizontal ? 'grid-horizontal' : 'grid-vertical'} grid-cols-${numCols} grid-rows-${numRows}`;

  rankBox.classList.toggle("hide-name", !cfg.showName);
  rankBox.classList.toggle("hide-score", !cfg.showScore);
  
  // Chỉ ẩn round khi user CHỦ ĐỘNG TẮT trong cài đặt, còn mặc định Top 1 phải giữ
  rankBox.classList.toggle("hide-round", !cfg.showRound);
  
  rankBox.classList.remove("av-none", "av-small", "av-large");
  rankBox.classList.add(`av-${cfg.avSize}`);

  // ---------------------------------------------------------------
  // BƯỚC 4: CẬP NHẬT DOM — GIỮ NGUYÊN CÁC <li> ĐÃ CÓ (tránh giật marquee)
  // ---------------------------------------------------------------
  const seenIds = new Set();

  sliced.forEach((item, index) => {
    const { idol, globalRank } = item;
    seenIds.add(idol.id);

    // Tính toán Tọa độ Hàng (row) & Cột (col) trong Grid CSS
    let r, c;
    if (cfg.order === "col") {
      c = Math.floor(index / numRows) + 1;
      r = (index % numRows) + 1;
    } else {
      r = Math.floor(index / numCols) + 1;
      c = (index % numCols) + 1;
    }

    let entry = rankElMap.get(idol.id);
    if (!entry) {
      // Idol mới xuất hiện trong danh sách -> tạo <li> mới
      const li = document.createElement("li");
      li.innerHTML = `
        <div class="avatar"></div>
        <div class="widget-mix-rank__text">
          <span class="widget-mix-rank__name" style="width: 110px;">
            <div class="marquee"></div>
          </span>
          <span class="widget-mix-rank__score"></span>
        </div>
        <div class="widget-mix-rank__name-bg"></div>
      `;
      rankList.appendChild(li);
      entry = {
        li,
        avEl: li.querySelector(".avatar"),
        marqueeEl: li.querySelector(".marquee"),
        scoreEl: li.querySelector(".widget-mix-rank__score"),
        nameBgEl: li.querySelector(".widget-mix-rank__name-bg"),
        lastName: null,
        lastAvatar: undefined
      };
      rankElMap.set(idol.id, entry);
    }

    const li = entry.li;
    li.style.gridRow = `${r}`;
    li.style.gridColumn = `${c}`;

    let cls = "";
    if (idol.active) cls += "widget-mix-rank__item--current ";
    if (idol.eliminated) cls += "widget-mix-rank__item--disabled ";
    li.className = cls.trim();
    li.setAttribute("data-rank", globalRank);

    // Avatar: chỉ cập nhật khi thay đổi
    if (entry.lastAvatar !== idol.avatar) {
      entry.lastAvatar = idol.avatar;
      entry.avEl.outerHTML = idol.avatar
        ? `<div class="avatar" style="background-image: url('${idol.avatar}'); background-size: cover;"></div>`
        : `<div class="avatar"><span><em>${initials(idol.name)}</em></span></div>`;
      entry.avEl = li.querySelector(".avatar");
    }

    // Điểm số: cập nhật mỗi lần (không đụng tới marquee tên)
    entry.scoreEl.textContent = (Number(idol.score) || 0).toLocaleString();
    entry.nameBgEl.textContent = idol.name;

    // Tên: chỉ khởi tạo lại marquee khi tên thực sự đổi -> không bị giật khi điểm cuộn lên
    if (entry.lastName !== idol.name) {
      entry.lastName = idol.name;
      mcaInitMarquee(entry.marqueeEl, idol.name);
    }

    // Badge OUT
    const wantOut = !!idol.eliminated;
    const outEl = li.querySelector(".widget-mix-rank__out");
    if (wantOut && !outEl) {
      const badge = document.createElement("i");
      badge.className = "widget-mix-rank__out";
      badge.textContent = "OUT";
      li.appendChild(badge);
    } else if (!wantOut && outEl) {
      outEl.remove();
    }
  });

  // Dọn các idol không còn hiển thị (bị loại khỏi phạm vi TOP hoặc bị xoá)
  for (const [id, entry] of rankElMap) {
    if (!seenIds.has(id)) {
      entry.li.remove();
      rankElMap.delete(id);
    }
  }
}

// Cuộn tên dài từ phải sang trái nếu tên bị tràn khỏi khung hiển thị
function mcaInitMarquee(marqueeEl, text) {
  if (!marqueeEl) return;
  marqueeEl.innerHTML = "";
  const probe = document.createElement("span");
  probe.textContent = text;
  probe.style.whiteSpace = "nowrap";
  probe.style.display = "inline-block";
  marqueeEl.appendChild(probe);
  const boxWidth = marqueeEl.clientWidth;
  const textWidth = probe.scrollWidth;
  if (boxWidth > 0 && textWidth > boxWidth) {
    marqueeEl.innerHTML = "";
    const track = document.createElement("div");
    track.className = "mca-marquee-track";
    [1, 2].forEach(() => {
      const span = document.createElement("span");
      span.textContent = text;
      const gap = document.createElement("span");
      gap.className = "mca-gap";
      track.appendChild(span);
      track.appendChild(gap);
    });
    const speed = 28; // px/giây (chạy chậm & êm hơn)
    const duration = Math.max(5, (textWidth + 32) / speed);
    track.style.animationDuration = duration + "s";
    marqueeEl.appendChild(track);
  } else {
    // Tên ngắn: giữ nguyên inline, canh trái, canh giữa dọc qua flexbox cha
    probe.style.position = "static";
    probe.style.top = "";
    probe.style.left = "";
    probe.style.transform = "";
  }
}

// Kết nối WebSocket
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = ev => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === "state") {
        state = msg.data;
        render();
      }
    } catch (e) {
      console.error("Lỗi WebSocket:", e);
    }
  };
  ws.onclose = () => setTimeout(connect, 1500);
}

connect();
