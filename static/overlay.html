<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Overlay</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
  }
  #wrap {
    width: 480px;
    padding: 16px;
  }
  #timer {
    text-align: center;
    font-size: 42px;
    font-weight: bold;
    text-shadow: 0 0 8px #000, 0 0 8px #000;
    margin-bottom: 10px;
  }
  #timer.finished { color: #ffd54a; }
  .idol-row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    background: rgba(0,0,0,0.45);
    border-radius: 10px;
    padding: 6px 10px;
  }
  .idol-row.active { outline: 2px solid #ffd54a; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background-size: cover; background-position: center;
    background-color: #444;
    flex-shrink: 0;
    margin-right: 10px;
    border: 2px solid #fff;
  }
  .rank {
    width: 22px; font-weight: bold; text-align: center; margin-right: 6px;
    text-shadow: 0 0 6px #000;
  }
  .info { flex: 1; min-width: 0; }
  .name-row {
    display: flex; justify-content: space-between; font-size: 14px;
    margin-bottom: 4px; text-shadow: 0 0 4px #000;
  }
  .name { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score { font-weight: bold; }
  .bar-bg {
    background: rgba(255,255,255,0.15);
    border-radius: 6px;
    height: 10px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff5f6d, #ffc371);
    border-radius: 6px;
    transition: width 0.4s ease;
  }
  .winner-banner {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    color: #ffd54a;
    text-shadow: 0 0 8px #000;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="timer">--:--</div>
  <div id="winner" class="winner-banner" style="display:none;"></div>
  <div id="idols"></div>
</div>

<script>
let state = null;

function fmtTime(sec) {
  sec = Math.max(0, sec | 0);
  const m = Math.floor(sec / 60).toString().padStart(2, "0");
  const s = (sec % 60).toString().padStart(2, "0");
  return m + ":" + s;
}

function render() {
  if (!state) return;

  const timerEl = document.getElementById("timer");
  timerEl.textContent = fmtTime(state.timer.remaining);
  timerEl.classList.toggle("finished", state.timer.finished);

  const idols = [...state.idols].sort((a, b) => b.score - a.score);
  const maxScore = Math.max(1, ...idols.map(i => i.score));

  const winnerEl = document.getElementById("winner");
  if (state.timer.finished && idols.length > 0) {
    winnerEl.style.display = "block";
    winnerEl.textContent = "🏆 " + idols[0].name;
  } else {
    winnerEl.style.display = "none";
  }

  const container = document.getElementById("idols");
  container.innerHTML = "";
  idols.forEach((idol, index) => {
    const row = document.createElement("div");
    row.className = "idol-row" + (idol.active ? " active" : "");

    const rank = document.createElement("div");
    rank.className = "rank";
    rank.textContent = "#" + (index + 1);

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    if (idol.avatar) avatar.style.backgroundImage = `url('${idol.avatar}')`;

    const info = document.createElement("div");
    info.className = "info";

    const nameRow = document.createElement("div");
    nameRow.className = "name-row";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = idol.name;
    const score = document.createElement("div");
    score.className = "score";
    score.textContent = idol.score.toLocaleString();
    nameRow.appendChild(name);
    nameRow.appendChild(score);

    const barBg = document.createElement("div");
    barBg.className = "bar-bg";
    const barFill = document.createElement("div");
    barFill.className = "bar-fill";
    barFill.style.width = (idol.score / maxScore * 100) + "%";
    barBg.appendChild(barFill);

    info.appendChild(nameRow);
    info.appendChild(barBg);

    row.appendChild(rank);
    row.appendChild(avatar);
    row.appendChild(info);
    container.appendChild(row);
  });
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "state") {
      state = msg.data;
      render();
    }
  };
  ws.onclose = () => setTimeout(connect, 1500);
}
connect();
</script>
</body>
</html>
